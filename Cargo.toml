[workspace]
resolver = "2"
members = ["crates/harness", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "process", "io-util", "sync", "macros", "time", "fs", "net"] }
tracing = "0.1"
