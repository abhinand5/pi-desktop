[package]
name = "pi-desktop"
version.workspace = true
description = "Pi Desktop - a minimal, SSH-first desktop cockpit for pi and omp coding agents"
authors = ["abhinand"]
edition.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "pi_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri-plugin-os = "2"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.7.2"
# Path only, deliberately. A version requirement on a sibling that is never
# published buys nothing and breaks the moment the workspace version leaves the
# range it names: the release workflow rewrites that version from the tag, so
# `^0.1.0` resolved fine for every 0.1.x tag and failed on the first minor bump.
harness = { path = "../crates/harness" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tracing.workspace = true
tauri-plugin-notification = "2.3.3"
portable-pty = "0.9"
base64 = "0.22"
arboard = { version = "3", features = ["wayland-data-control"] }
png = "0.17"

